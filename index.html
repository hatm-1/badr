<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مراجع الرسم">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مراجع الرسم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--s1:#151517;--s2:#1e1e21;--line:#2b2b30;--ink:#f4f0e6;--mute:#a39e93;--gold:#d4af37;--gold-hi:#ecc95c;--gold-bg:rgba(212,175,55,.13);--pin:#ff5c70;--pin-bg:rgba(230,0,35,.15);--danger:#ff6b6b;--r:14px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;line-height:1.6;font-size:16px;min-height:100vh;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;fill:currentColor;flex:none;display:block}
.ic.rtl{transform:scaleX(-1)}

header.top{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(10px + var(--st)) 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:9px;display:block}
.top h1{flex:1;margin:0;font-size:20px;font-weight:700;color:var(--gold);line-height:1.2}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--ink);flex:none}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(100px + var(--sb))}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(15,15,17,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sb))}
nav.tabs .in{display:flex;max-width:480px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;color:var(--mute);font-size:12px;font-weight:600}
nav.tabs button[aria-current="page"]{color:var(--gold)}

.search{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;padding-inline-start:12px;margin-bottom:18px}
.search .ic{color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;padding:9px 2px;outline:none}
.search input::placeholder{color:#77736b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:11px;background:var(--gold);color:#141108;font-weight:700;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid rgba(255,107,107,.35)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn .ic{width:19px;height:19px}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.sec:first-child{margin-top:4px}
.sec h2{margin:0;font-size:17px}
.sec span{color:var(--mute);font-size:13px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);text-align:start;min-height:122px;position:relative;transition:transform .12s,border-color .12s}
.cat:active{transform:scale(.97);border-color:var(--gold)}
.bub{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--gold-bg);color:var(--gold);flex:none}
.cat b{font-size:16px;line-height:1.3}
.cat small{display:block;color:var(--mute);font-size:12.5px;line-height:1.4;margin-top:2px}
.cat .pill{position:absolute;top:12px;left:12px}
.cat.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mute);gap:6px}
.cat.add .bub{background:var(--s2);color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--pin-bg);color:var(--pin);white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill.gold{background:var(--gold-bg);color:var(--gold)}

.back{display:inline-flex;align-items:center;gap:2px;color:var(--gold);font-weight:600;padding:4px 0;margin-bottom:6px}
.back .ic{width:20px;height:20px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.head h2{margin:0;font-size:22px;line-height:1.3}
.head small{display:block;color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:14px;margin:0 0 14px}
.info{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:14px;background:var(--pin-bg);color:#ffb3bd}
.info .ic{width:20px;height:20px;color:var(--pin);margin-top:2px}
.info.gold{background:var(--gold-bg);color:#ead9a3}
.info.gold .ic{color:var(--gold)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:stretch;border-radius:12px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.chip .go{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;text-decoration:none;color:var(--ink);font-weight:500}
.chip .go:active{background:var(--s2)}
.chip .go .ic{width:16px;height:16px;color:var(--gold)}
.chip.pin{border-color:rgba(255,92,112,.3)}
.chip.pin .go{color:#ffc2ca}
.chip.pin .go .ic{color:var(--pin)}
.chip .x{display:grid;place-items:center;padding:0 9px;color:var(--mute);border-inline-start:1px solid var(--line)}
.chip .x .ic{width:16px;height:16px}

.add{margin-top:22px;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}
.add p{margin:0 0 10px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.field{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);outline:none}
.field:focus{border-color:var(--gold)}
select.field{appearance:none;-webkit-appearance:none}

.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.seg a{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:14px;font-weight:600;color:var(--mute);text-decoration:none}
.seg [aria-pressed="true"]{background:var(--gold);color:#141108;border-color:var(--gold)}
.seg .ic{width:16px;height:16px}
.seg a{color:#ffc2ca;border-color:rgba(255,92,112,.3)}
.seg a .ic{color:var(--pin)}

.wall{column-count:2;column-gap:8px}
@media(min-width:620px){.wall{column-count:3}}
.tile{display:block;width:100%;margin:0 0 8px;border-radius:12px;overflow:hidden;background:var(--s2);break-inside:avoid;-webkit-column-break-inside:avoid;position:relative}
.tile img{display:block;width:100%;height:auto;min-height:80px}
.tile .mark{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:var(--gold)}
.tile .mark .ic{width:16px;height:16px}
.skel{height:170px;border-radius:12px;margin:0 0 8px;break-inside:avoid;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
.skel:nth-child(3n){height:230px}.skel:nth-child(4n){height:140px}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.msg{color:var(--mute);text-align:center;padding:28px 10px}
.msg .btn{margin-top:12px}
.more{display:flex;justify-content:center;margin-top:12px}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty .bub{margin:0 auto 12px;width:58px;height:58px;border-radius:18px}
.empty .bub .ic{width:30px;height:30px}

.ov{position:fixed;inset:0;z-index:30}
#lb{background:#000;display:flex;flex-direction:column;z-index:40}
.lbtop{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--st)) 12px 8px}
.lbtop .t{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtop .ibtn{background:#1a1a1c}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y pinch-zoom}
.stage img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .25s,filter .25s,opacity .2s}
.stage.flip img{transform:scaleX(-1)}
.stage.gray img{filter:grayscale(1)}
.stage .spin{position:absolute;color:var(--mute);font-size:14px}
.arrow{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,22,.7);color:#fff}
.arrow.prev{right:8px}.arrow.next{left:8px}
.bar{display:flex;justify-content:space-around;padding:8px 4px calc(8px + var(--sb));background:#0e0e10;border-top:1px solid var(--line)}
.bar button,.bar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink);text-decoration:none;min-width:56px;padding:4px 2px}
.bar .on{color:var(--gold)}
.bar [disabled]{opacity:.35}

#sheet{background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:45}
#sheet .card{width:100%;max-width:520px;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + var(--sb));max-height:82vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#sheet h3{margin:0 0 12px;font-size:18px}
.list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.list button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--s2);text-align:start;font-weight:500}
.list button .ic{color:var(--gold)}
.list button span{flex:1}
.list button .ck{color:var(--gold)}

#help{background:var(--bg);overflow-y:auto;z-index:25;padding:calc(12px + var(--st)) 16px calc(32px + var(--sb))}
#help .in{max-width:640px;margin:0 auto}
#help h2{font-size:22px;margin:4px 0 6px}
#help h3{font-size:17px;margin:24px 0 8px;color:var(--gold)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend>div{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:12px;font-size:14.5px}
.legend .bub{width:36px;height:36px;border-radius:10px}
.legend .bub .ic{width:20px;height:20px}
.legend b{display:block;font-size:15px}
.legend span{color:var(--mute)}
.ded{margin:34px 0 0;text-align:center;color:var(--gold);font-weight:600}

/* practice */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.opts button{padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--s1);font-weight:600;font-size:15px}
.opts button[aria-pressed="true"]{background:var(--gold);color:#141108;border-color:var(--gold)}
.lbl{display:block;font-weight:700;margin:18px 0 8px}
.lbl:first-of-type{margin-top:4px}
.start{width:100%;margin-top:22px;padding:14px;font-size:17px}
.hero{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(212,175,55,.16),rgba(212,175,55,.04));border:1px solid rgba(212,175,55,.25);margin-bottom:8px}
.hero p{margin:0;font-size:14px;color:#ddd3b8}
.hero b{display:block;font-size:17px;color:var(--ink)}
#sess{background:#000;display:flex;flex-direction:column;z-index:35}
.stop{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--st)) 14px 6px;gap:10px}
.stop .cnt{color:var(--mute);font-weight:600;font-size:15px;min-width:60px}
.clock{font-size:34px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:1px;direction:ltr}
.clock.low{color:var(--pin)}
.prog{height:3px;background:#1d1d20;margin:0 14px}
.prog i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:right;transition:transform 1s linear}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
.done .bub{width:70px;height:70px;border-radius:22px;margin-bottom:10px}
.done .bub .ic{width:38px;height:38px}
.done h2{margin:0;font-size:26px}
.done p{margin:0 0 18px;color:var(--mute)}

/* favorites */
.favtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.favtop h2{margin:0;font-size:22px}
.favtop span{color:var(--mute);font-size:14px}

/* intro */
#intro{background:#000;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:60;transition:opacity .45s}
#intro.off{opacity:0;pointer-events:none}
#intro img{width:180px;height:180px;border-radius:40px;box-shadow:0 0 70px rgba(212,175,55,.28);animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
#intro h2{font-size:30px;margin:26px 0 4px;animation:fade .6s .25s both}
#intro p{margin:0;font-size:18px;color:#b8962e;animation:fade .6s .4s both}
#intro .btn{margin-top:36px;padding:13px 52px;font-size:18px;border-radius:999px;background:none;color:var(--gold);border:1.5px solid var(--gold);animation:fade .6s .55s both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sb));transform:translateX(-50%);z-index:70;background:#26262a;border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
</style>
</head>
<body>
<header class="top"><div class="top-in">
<img class="logo" id="logo" alt="">
<h1>مراجع الرسم</h1>
<button class="ibtn" id="helpbtn" type="button" aria-label="التعليمات"></button>
</div></header>
<main id="view"></main>
<nav class="tabs" aria-label="الأقسام"><div class="in" id="tabs"></div></nav>

<div id="help" class="ov" hidden></div>
<div id="lb" class="ov" hidden></div>
<div id="sess" class="ov" hidden></div>
<div id="sheet" class="ov" hidden></div>

 if(S.folders.indexOf(DEF_FOLDER)<0)S.folders.unshift(DEF_FOLDER);
 S.fav.forEach(function(f){if(S.folders.indexOf(f.d)<0)S.folders.push(f.d)});
 if(d.pr&&typeof d.pr==="object")for(var k in S.pr)if(d.pr[k]!==undefined)S.pr[k]=d.pr[k];
 if(Array.isArray(d.custom))S.custom=d.custom.map(function(c,i){
  if(c.id&&Array.isArray(c.o))return c;
  return {id:"c"+Date.now().toString(36)+i,n:String(c.n||"تصنيف"),def:"stock",ic:"folder-outline",o:(c.s||[]).map(function(p){return Array.isArray(p)?{n:p[0],q:p[1],s:"stock"}:p})}
 }).filter(function(c){return c&&c.n});
 S.custom.forEach(function(c){c.ic=c.ic||"folder-outline";c.def=c.def||"stock";c.d=c.d||"تصنيفك"});
 if(d.extra&&typeof d.extra==="object"){
  S.extra={};
  for(var key in d.extra){
   var cat=catById(key)||CATS.filter(function(x){return x.n===key})[0]||catById(ALIAS[key]);if(!cat||!Array.isArray(d.extra[key]))continue;
   S.extra[cat.id]=d.extra[key].map(function(p){return Array.isArray(p)?{n:p[0],q:p[1],s:cat.def==="animeq"?"animeq":cat.def}:p}).filter(function(o){return o&&o.n});
  }
 }
}

/* كل طلب له وقت أقصى. لو المصدر ما رد، ننتقل للمصدر الاحتياطي بسرعة بدل ما ننتظر */
async function getJSON(url,opt){
 opt=opt||{};var tries=opt.tries||2,to=opt.timeout||9000;
 for(var t=0;t<tries;t++){
  var ctl=window.AbortController?new AbortController():null,timer=ctl?setTimeout(function(){ctl.abort()},to):0,r;
  try{r=await fetch(url,{method:opt.method||"GET",headers:opt.headers||{},body:opt.body,signal:ctl?ctl.signal:undefined})}
  catch(err){clearTimeout(timer);var ab=err&&err.name==="AbortError",e=new Error(ab?"ما رد في الوقت":"ما قدر يتصل");e.kind=ab?"timeout":"net";throw e}
  if(r.ok){try{var j=await r.json();clearTimeout(timer);return j}catch(x){clearTimeout(timer);var e2=new Error(x&&x.name==="AbortError"?"ما رد في الوقت":"رد غير مفهوم");e2.kind="bad";throw e2}}
  clearTimeout(timer);
  if((r.status===429||r.status>=500)&&t<tries-1){await sleep(1500);continue}
  var e3=new Error(r.status===429?"ضغط كثير، حاول بعد شوي":"خطأ "+r.status);e3.status=r.status;e3.kind="http";throw e3;
 }
}
/* يجرب المصادر بالترتيب، ويثبت على المصدر اللي نجح للصفحات الجاية */
var STICK={};
async function chain(key,p,steps){
 var start=p>1&&STICK[key]!=null?STICK[key]:0,errs=[],empty=null;
 for(var i=start;i<steps.length;i++){
  try{var r=await steps[i][1]();
   if(r&&r.items&&r.items.length){STICK[key]=i;r.via=steps[i][0];return r}
   empty=empty||r;errs.push(steps[i][0]+": ما فيه نتائج")}
  catch(e){errs.push(steps[i][0]+": "+(e.message||"خطأ"))}
 }
 if(empty)return {items:[],more:false};
 var er=new Error("all");er.detail=errs.join(" · ");throw er;
}
function slice(list,p,n){return {items:list.slice((p-1)*n,p*n),more:p*n<list.length}}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g," ").trim()}
function okImg(u){return !!u&&!/questionmark|apple-touch-icon|\/default\.(jpg|png)/.test(u)}

/* --- AniList (المصدر الأساسي للأنمي) --- */
var CF="id name{full} image{large} siteUrl";
async function al(query,vars){
 var j=await getJSON("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query:query,variables:vars||{}}),timeout:10000});
 if(!j||!j.data){var e=new Error("رد غير مفهوم");if(j&&j.errors&&j.errors[0]){e.status=j.errors[0].status;e.message=j.errors[0].message||e.message}throw e}
 return j.data;
}
function alMap(nodes){return (nodes||[]).map(function(c){var u=c&&c.image&&c.image.large;return okImg(u)?{t:u,f:u,l:c.siteUrl||"https://anilist.co/character/"+c.id,s:"al",id:c.id,ti:(c.name&&c.name.full)||""}:null}).filter(Boolean)}
function alConn(c){return {items:alMap(c&&c.nodes),more:!!(c&&c.pageInfo&&c.pageInfo.hasNextPage)}}
async function alAnime(idMal,p){
 var d=await al("query($m:Int,$p:Int){Media(idMal:$m,type:ANIME){id characters(sort:[FAVOURITES_DESC],page:$p,perPage:30){pageInfo{hasNextPage} nodes{"+CF+"}}}}",{m:idMal,p:p});
 return alConn(d.Media&&d.Media.characters);
}
async function alMediaChars(id,p){
 var d=await al("query($i:Int,$p:Int){Media(id:$i){characters(sort:[FAVOURITES_DESC],page:$p,perPage:30){pageInfo{hasNextPage} nodes{"+CF+"}}}}",{i:id,p:p});
 return alConn(d.Media&&d.Media.characters);
}
var ALQ={};
async function alSearch(q,p){
 var k=norm(q);
 if(ALQ[k]===undefined){
  ALQ[k]=0;
  try{var d=await al("query($q:String){Media(search:$q,type:ANIME,isAdult:false,sort:[SEARCH_MATCH]){id title{romaji english native} synonyms}}",{q:q});
   var m=d.Media;if(m){var ts=[m.title.romaji,m.title.english,m.title.native].concat(m.synonyms||[]);if(ts.some(function(t){return norm(t).indexOf(k)>-1}))ALQ[k]=m.id}}
  catch(e){if(e.status!==404){delete ALQ[k];throw e}}
 }
 if(ALQ[k])return alMediaChars(ALQ[k],p);
 var c=await al("query($q:String,$p:Int){Page(page:$p,perPage:30){pageInfo{hasNextPage} characters(search:$q,sort:[SEARCH_MATCH]){"+CF+"}}}",{q:q,p:p});
 return {items:alMap(c.Page.characters),more:!!c.Page.pageInfo.hasNextPage};
}
async function alTop(p){
 var c=await al("query($p:Int){Page(page:$p,perPage:30){pageInfo{hasNextPage} characters(sort:[FAVOURITES_DESC]){"+CF+"}}}",{p:p});
 return {items:alMap(c.Page.characters),more:!!c.Page.pageInfo.hasNextPage&&p<20};
}
async function alRel(id,p){
 var d=await al("query($i:Int,$p:Int){Character(id:$i){media(sort:[POPULARITY_DESC],type:ANIME,perPage:1){nodes{characters(sort:[FAVOURITES_DESC],page:$p,perPage:30){pageInfo{hasNextPage} nodes{"+CF+"}}}}}}",{i:id,p:p});
 var n=d.Character&&d.Character.media&&d.Character.media.nodes&&d.Character.media.nodes[0];
 var r=alConn(n&&n.characters);r.items=r.items.filter(function(x){return x.id!==id});return r;
}

function mapChars(arr){
 return (arr||[]).slice().sort(function(a,b){return (b.favorites||0)-(a.favorites||0)}).map(function(x){
  var c=x.character||x,u=jkImg(c.images);return okImg(u)?{t:u,f:u,l:c.url,s:"jk",id:c.mal_id,ti:c.name||""}:null}).filter(Boolean);
}

 try{j=await jk("/anime/"+id+"/characters")}

 var a=await jk("/anime?limit=5&sfw=true&order_by=members&sort=desc&q="+enc(q)),nq=norm(q),hit=null;
 (a.data||[]).some(function(x){var ts=[x.title,x.title_english,x.title_japanese].concat((x.titles||[]).map(function(t){return t.title}));if(ts.some(function(t){return norm(t).indexOf(nq)>-1})){hit=x;return true}return false});
 var list;
